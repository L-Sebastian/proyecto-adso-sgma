<div class="profile-container">
    <div class="profile-grid">

        <!-- Left Column -->
        <div class="profile-left">

            <label class="avatar avatarContainer">
                <input type="file" class="photoInput" accept="image/*" style="display:none;">
                <img class="avatarImg" src="" alt="Foto de perfil"
                     style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:none;">
                <svg class="avatarSvg avatar-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </label>

            <h2 class="profile-name profileName"></h2>

            <div class="button-group">
                <button class="btn-profile btn-primary-profile editBtn" type="button">Editar Perfil</button>

                <button class="bnt-profile btn-primary-profile uploadBtn" type="button">Subir Foto</button>
            </div>
        </div>

        <!-- Right Column - solo lectura -->
        <div class="profile-right-user">

            <div class="form-row-edit-profile-user">
                <label class="label-edit-profile-user">Primer Nombre
                    <input type="text" name="firstName"
                           class="form-input-edit-profile-user inputFirstName" readonly>
                </label>
                <label class="label-edit-profile-user">Segundo Nombre
                    <input type="text" name="secondName"
                           class="form-input-edit-profile-user inputSecondName" readonly>
                </label>
            </div>

            <div class="form-row-edit-profile-user">
                <label class="label-edit-profile-user">Primer Apellido
                    <input type="text" name="firstLastName"
                           class="form-input-edit-profile-user inputFirstLastName" readonly>
                </label>
                <label class="label-edit-profile-user">Segundo Apellido
                    <input type="text" name="secondLastName"
                           class="form-input-edit-profile-user inputSecondLastName" readonly>
                </label>
            </div>

            <div class="form-row-edit-profile-user full-width">
                <label class="label-edit-profile-user">Correo electrónico
                    <input type="email" name="email"
                           class="form-input-edit-profile-user inputEmail"
                        readonly>
                </label>
            </div>

            <div class="form-row-edit-profile-user">
                <label class="label-edit-profile-user">Departamento
                    <select name="departamento"
                            class="profile__form-select selectDepartamento" disabled
                            autocomplete="address-level1">
                        <option value="">-Selecciona tu departamento-</option>
                        <option value="Risaralda" >Risaralda</option>
                        <option value="Quindío">Quindío</option>
                        <option value="Caldas">Caldas</option>
                    </select>
                </label>
                <label class="label-edit-profile-user">Dirección
                    <input type="text" name="address"
                           class="form-input-edit-profile-user inputAddress" readonly>
                </label>
                
                <label class="label-edit-profile-user">Numero de telefono
                    <input type="text" name="telefono"
                           class="form-input-edit-profile-user inputTelefono" readonly>
                </label>

                <label class="label-edit-profile-user">Contraseña
                    <input type="password" name="password"
                           class="form-input-edit-profile-user inputPassword" readonly>
                </label>
            </div>

        </div>

    </div>
    
<button class="profile-vevo-back-btn btnGoBack" aria-label="Regresar">↶</button>
</div>

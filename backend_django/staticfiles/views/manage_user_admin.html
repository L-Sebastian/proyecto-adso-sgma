        .crud__admin{
            background-color: aliceblue;

            width: 140rem;
            margin: 0 auto;
        }

        .crud__admin__title{
            font-size: 3.2rem;

            padding: 1rem;
        }
        .crud__table{
            margin: 0 auto;
        }

        .crud__table {
             width: 100%; 
            border-collapse: collapse;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            }

        th {
            background-color: #333;
            color: white;
            padding: 10px;
            font-size: 1.6rem;
            }

        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 1.6rem;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .view-btn{
            background-color: #0b3c87;
        }
        .view-btn:hover{
            background-color: #051E42;
        }

        button {
            padding: 5px 10px;
            border: none;
            background-color: crimson;
            color: white;
            cursor: pointer;
            font-size: 1.6rem;
            border-radius: 4px;
            width: 150px;
            height: 40px;
        }

        button:hover {
            background-color: darkred;
        }

        .role-dropdown {
            position: relative;
            display: inline-block;
        }

        .role-btn {
            background-color: #0b3c87;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        .role-btn:hover {
            background-color: #051E42;
        }

        .role-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            min-width: 100px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .role-menu p {
            margin: 0;
            padding: 8px 12px;
            cursor: pointer;
            width: 150px;
            height: 40px;
        }

        .role-menu p:hover {
            background-color: #f0f0f0;
        }
    </style>

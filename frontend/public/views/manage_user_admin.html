<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Usuarios</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/frontend/public/css/main.css">

    <!-- Scripts -->
    <script src="/frontend/public/js/components/header-gov.js"></script>
    <script src="/frontend/public/js/components/header-product.js"></script>

            background-size: cover;
        }

        .manage__user{
            align-self: center;

        } 

        .manage__user__user{
            display: flex;

        }

        .manage__user__user__information{
            display: flex;
            justify-content: space-around;
        }

            </div>

            <div class="manage__user__user__information">
                <p class=""> 01 </p>
                <p class=""> Mariana </p>
                <p class=""> Piedrahíta </p>
                <p class=""> guru1317@gmail.com </p>
                <p> Si </p>

                    <button> Ver </button>

            </div>

    <footer class="footer__index">
        <div class="footer-container"></div>
    </footer>

</html>

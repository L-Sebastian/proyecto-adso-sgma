<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMA - Piña Oro Miel</title>
    <link rel="stylesheet" href="/frontend/public/css/components/shopping_pineapple.css">
</head>
<body>

    <div class="main-content">
        <div class="product-card">
            <div class="product-image-section">
                <img src="/frontend/public/img/piña.jpg" alt="Piña Oro Miel" class="product-image">
            </div>

            <div class="product-info-section">
                <h1 class="product-title">Piña Oro Miel<br>Unidad</h1>
                
                <div class="product-main-details"> <div class="price-and-seller">
                        <div class="price-section">
                            <span class="old-price">$4000</span>
                            <span class="current-price">$3600</span>
                            <span class="discount-badge">10%</span>
                        </div>
                        <p class="seller-info">Vendido por: <strong>Finca el Porvenir</strong></p>
                    </div>

                    <div class="delivery-and-actions"> <div class="delivery-box">
                            <div class="delivery-title">Condiciones de entrega</div>
                            <div class="delivery-item">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <circle cx="10" cy="10" r="9" stroke="#10b981" stroke-width="2"/>
                                    <circle cx="10" cy="10" r="5" fill="#10b981"/>
                                </svg>
                                <div>
                                    <strong>Enviado por:</strong> Finca el Porvenir
                                </div>
                            </div>
                            <div class="delivery-item">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                    <circle cx="10" cy="10" r="9" stroke="#999" stroke-width="2"/>
                                    <circle cx="10" cy="10" r="5" fill="#999"/>
                                </svg>
                                <div>
                                    <strong>Disponible para:</strong> Compra y recoge
                                </div>
                            </div>
                        </div>    

                        <div class="action-section">
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="decreaseQuantity()">−</button>
                                <input type="number" class="quantity-input" value="1" min="1" id="quantity" readonly>
                                <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                            </div>
                            <button class="add-to-cart-btn" onclick="addToCart()">
                                <span>Agregar</span>
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.4 2.4M17 13l1.4 2.4M9 17a1 1 0 100 2 1 1 0 000-2zM15 17a1 1 0 100 2 1 1 0 000-2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                </div>
                
                <div class="product-details">
                    <div class="details-header">Detalles del producto</div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <div class="detail-label">Referencia</div>
                            <div class="detail-value">SIN REF.</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Tipo de producto</div>
                            <div class="detail-value">Fruta</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Número de piezas</div>
                            <div class="detail-value">1</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="back-button" onclick="goBack()">↶</button>

    <script>
        function decreaseQuantity() {
            let quantityInput = document.getElementById('quantity');
            let currentValue = parseInt(quantityInput.value);
            if (currentValue > 1) {
                quantityInput.value = currentValue - 1;
            }
        }

        function increaseQuantity() {
            let quantityInput = document.getElementById('quantity');
            let currentValue = parseInt(quantityInput.value);
            quantityInput.value = currentValue + 1;
        }

        function addToCart() {
            alert('Producto agregado al carrito!');
            // Aquí puedes agregar la lógica para añadir al carrito
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>

  <!-- BRAND NAVBAR (segundo navbar con logo) -->
  <nav class="brandbar">
    <a class="brand" href="#">
      <img src="/frontend/public/img/logo1.png" alt="Logo SGMA" class="brand-logo" />
      <span class="brand-text">SGMA</span>
    </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="contenedor">
    <!-- Sección imagen / testimonial -->
    <section class="imagen">
      <!-- <div class="imagen-overlay">
        <h2 class="nombre">DOÑA GLORIA</h2>
        <h3 class="rol">Productora de plátano</h3>
        <p class="testimonio">
          “Antes vendía solo a conocidos, pero ahora más personas saben de mis plátanos.
          Las ventas se han mantenido constantes. Gracias SGMA”
        </p>
      </div> -->
    </section>

    <!-- Sección formulario -->
    <section class="formulario">
      <h2 class="form-title">CREAR UNA CUENTA</h2>
      <form id="formRegistro" class="register-form" novalidate>
        <label class="sr-only" for="nombre">Nombre completo</label>
        <input id="nombre" type="text" required />

        <label class="sr-only" for="telefono">Número de teléfono</label>
        <input id="telefono" type="tel" required />

        <label class="sr-only" for="departamento">Departamento</label>
        <select id="departamento" class="departamento" required>
          <option value="">-seleciona tu departamento</option>
          <option value="Riaralda">Risaralda</option>
          <option value="Quindio">Quindio</option>
          <option value="Caldas">Caldas</option>
        </select>

        <label class="sr-only" for="email">Correo electrónico</label>
        <input id="email" type="email" required />

        <label class="sr-only" for="password">Contraseña</label>
        <input id="password" type="password" required />

        <button type="submit" class="btn-crear">Crear Cuenta</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>©SGMA - TODOS LOS DERECHOS RESERVADOS</p>
  </footer>

  <script src="/frontend/public/js/pages/register.js"></script>

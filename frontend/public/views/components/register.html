<section class="register__image" aria-hidden="true"></section>

<section class="register__form" aria-labelledby="registerTitle">
    <h2 class="register__title registerTitle">CREAR UNA CUENTA</h2>

    <form class="register__form-container formRegistro" novalidate>

        <div class="register__form-group">
            <label>Primer nombre</label>
            <input class="register__form-input inputNombre" type="text"
                   required autocomplete="name" placeholder="Juan" />

            <label>Segundo nombre</label>
            <input class="register__form-input inputNombre" type="text"
                   required autocomplete="name" placeholder="luis" />

            <label>Primer apellido</label>
            <input class="register__form-input inputNombre" type="text"
                   required autocomplete="name" placeholder="de la cruz" />

            <label>Segundo Apellido</label>
            <input class="register__form-input inputNombre" type="text"
                   required autocomplete="name" placeholder="agudelo" />
        </div>

        <div class="register__form-group">
            <label>Número de teléfono</label>
            <input class="register__form-input inputTelefono" type="tel"
                   pattern="[0-9]{7,10}" title="Debe contener entre 7 y 10 números"
                   required autocomplete="tel" placeholder="3001234567" />
        </div>

        <div class="register__form-group">
            <label>Departamento</label>
            <select name="departamento" class="register__form-select selectDepartamento"
                    required autocomplete="address-level1">
                <option value="">- Selecciona tu departamento -</option>
                <option value="Risaralda">Risaralda</option>
                <option value="Quindío">Quindío</option>
                <option value="Caldas">Caldas</option>
            </select>
        </div>

        <div class="register__form-group">
            <label>Correo electrónico</label>
            <input class="register__form-input inputEmail" type="email"
                   required autocomplete="email" placeholder="ejemplo@correo.com" />
        </div>

        <div class="register__form-group">
            <label>Contraseña</label>
            <input class="register__form-input inputPassword" type="password"
                   required autocomplete="new-password" placeholder="••••••••" />
        </div>

        <div class="register__form-help formHelp" aria-live="polite"></div>

        <button type="submit" class="register__form-button">Crear Cuenta</button>

    </form>
</section>

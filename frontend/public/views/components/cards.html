<!-- Este bloque se rellena dinámicamente con datos de las cards -->
<div class="card">
    <!-- Encabezado de la tarjeta (Avatar y Nombre de Usuario) -->
    <div class="card__header">
        <img src="{{icon1}}" alt="Avatar del usuario" class="card__avatar">
        <h2 class="card__title">{{title}}</h2>
    </div>

    <!-- Contenedor de la imagen principal -->
    <div class="card__image-container">
        <img src="{{icon2}}" alt="Imagen del evento" class="card__image">
    </div>

    <!-- Pie de la tarjeta (Likes y Descripción) -->
    <div class="card__footer">
        <div class="card__likes">
            <!-- Icono de "Me Gusta" (simulado con un placeholder) -->
            <img src="/frontend/public/img/like.png " alt="Icono de Me Gusta" class="card__like-icon">
            <p class="card__like">{{likes}}</p>
        </div>
        <p class="card__description">{{description}}</p>
    </div>

    <!-- Bloque original solicitado por el usuario (oculto con CSS) -->
    <div class="car__icons">
        <img src="{{icon1}}" alt="[Ícono principal]" class="card__icon card__icon-primary">
        <img src="{{icon2}}" alt="Ícono principal" class="card__icon card__icon-secundary">
    </div>
</div>

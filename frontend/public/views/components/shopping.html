<div class="shopping__hero" aria-hidden="true"></div>

<div class="shopping__overlay">
    <div class="shopping__inner">

        <!-- ================= CARRITO ================= -->
        <div class="shopping__products">
            <ul class="shopping__list" id="shoppingItems"></ul>
            <div class="shopping__empty" id="shoppingEmpty" hidden>
                <p>No hay productos en el carrito.</p>
            </div>
        </div>

        <!-- ================= CHECKOUT ================= -->
        <aside class="shopping__checkout" aria-label="Resumen de pago">
            <h3 class="shopping__checkout-title">Total a pagar</h3>

            <div class="shopping__amount-row">
                <span class="shopping__amount" id="checkoutTotal">$0</span>
                <span class="shopping__currency">pesos</span>
            </div>

            <div class="payment-icons">
                <img src="/frontend/public/img/visa.svg" alt="Visa">
                <img src="/frontend/public/img/mastercard.svg" alt="Mastercard">
                <img src="/frontend/public/img/american-express.svg" alt="American Express">
                <img src="/frontend/public/img/pse-seeklogo.svg" alt="PSE">
            </div>

            <div id="payHelp" class="shopping__pay-help" aria-live="polite"></div>

            <button class="btn btn--primary shopping__pay" id="payBtn">Pagar</button>
        </aside>

    </div>
</div>

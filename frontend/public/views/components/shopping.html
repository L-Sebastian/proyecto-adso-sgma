
<section class="shopping" aria-labelledby="shoppingTitle">

  <!-- Fondo -->
  <div class="shopping__hero"></div>

  <!-- CONTENEDOR SUPERIOR -->
  <div class="shopping__overlay">

    <div class="shopping__inner">

      <!-- ================= CARRITO ================= -->
      <main class="shopping__products">

        <h2 class="shopping__heading">Carrito de compras</h2>

        <ul class="shopping__list" id="shoppingItems"></ul>

        <div class="shopping__empty" id="shoppingEmpty" hidden>
          <p>No hay productos en el carrito.</p>
        </div>

      </main>

      <!-- ================= CHECKOUT ================= -->
      <aside class="shopping__checkout">

        <h3 class="shopping__checkout-title">Total a pagar</h3>

        <div class="shopping__summary">
          <span class="shopping__amount" id="checkoutTotal">$0</span>
          <span class="shopping__currency">pesos</span>
        </div>

        <div class="payment-icons">
          <img src="/frontend/public/img/mastercard.svg" alt="Mastercard">
          <img src="/frontend/public/img/american-express.svg" alt="Amex">
          <img src="/frontend/public/img/pay.jpg" alt="PayPal">
        </div>

        <button class="btn btn--primary shopping__pay" id="payBtn">
          Pagar
        </button>

      </aside>

    </div>
  </div>

</section>

<!-- shopping.html (component) -->
<body>
    

    <section class="shopping" aria-labelledby="shoppingTitle">
    <div class="shopping__hero" aria-hidden="true"></div>

    <div class="container shopping__inner">
        <main class="shopping__products" id="cartList" aria-live="polite">
        <h2 id="shoppingTitle" class="shopping__title sr-only">Carrito de compras</h2>

        <!-- Product list (injected by HTML file or server initially) -->
        <ul class="shopping__list" id="shoppingItems" role="list"></ul>

        <!-- empty state -->
        <div class="shopping__empty" id="shoppingEmpty" hidden>
            <p>No hay productos en el carrito.</p>
        </div>
        </main>

        <aside class="shopping__checkout" aria-labelledby="checkoutHeading">
        <h3 id="checkoutHeading" class="shopping__checkout-title">Total a pagar</h3>

        <div class="shopping__summary" aria-live="polite">
            <div class="shopping__amount-row">
            <span class="shopping__amount" id="checkoutTotal">$0</span>
            <span class="shopping__currency">pesos</span>
            </div>
        </div>

        <div class="shopping__payments" aria-hidden="false">
            <div class="payment-icons" aria-hidden="true">
            <img src="/frontend/public/img/mastercard.svg" alt="Mastercard" class="payment-icons__img">
            <img src="/frontend/public/img/american-express.svg" alt="American Express" class="payment-icons__img">
            <img src="/frontend/public/img/paypal.svg" alt="PayPal" class="payment-icons__img">
            </div>
        </div>

        <button class="btn btn--primary shopping__pay" id="payBtn" type="button">Pagar</button>
        </aside>
    </div>
    </section>
</body>

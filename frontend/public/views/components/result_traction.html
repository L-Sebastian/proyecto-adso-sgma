<div class="page-wrapper">
    <h1 class="page-title">Resultado de la transacción</h1>

    <div class="receipt-card">
        <div class="receipt-header">
            <span class="sgma-logo">SGMA &#9881;</span>
            <p class="approved-text">Tu transacción ha sido aprobada</p>
        </div>

        <div class="receipt-body">

            <div class="field-group">
                <label>Nombre del pagador</label>
                <span class="field-value rt-nombre"></span>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>Finca</label>
                <span class="field-value rt-finca"></span>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>NIT / Documento</label>
                <span class="field-value rt-nit"></span>
                <div class="divider"></div>
            </div>

            <div class="field-row">
                <div class="field-group flex-1">
                    <label>ID Transacción</label>
                    <span class="field-value rt-id-tx"></span>
                </div>
                <div class="field-group text-right">
                    <label>Valor transacción</label>
                    <span class="field-value amount rt-valor"></span>
                    <div class="currency-tag">Moneda COP</div>
                </div>
            </div>
            <div class="divider"></div>

            <div class="field-group">
                <label>Descripción de la transacción</label>
                <span class="field-value rt-descripcion"></span>
                <div class="ref-tag rt-ref"></div>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>Banco / Medio de pago</label>
                <span class="field-value rt-banco"></span>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>Teléfono</label>
                <span class="field-value rt-telefono"></span>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>Medio de pago</label>
                <div class="payment-icon">
                    <img src="/frontend/public/img/pse-seeklogo.svg" alt="PSE">
                </div>
                <div class="divider"></div>
            </div>

            <div class="field-group">
                <label>Fecha</label>
                <span class="field-value rt-fecha"></span>
                <div class="divider"></div>
            </div>

        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-secondary btnIrAlInicio">Ir al inicio</button>
        <button class="btn btn-primary btnImprimir">Imprimir / Descargar PDF</button>
    </div>
</div>

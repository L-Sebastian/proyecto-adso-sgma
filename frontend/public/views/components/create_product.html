<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMA - Crear Producto</title>

    <!-- Enlace a tu CSS -->
    <link rel="stylesheet" href="/frontend/public/css/components/create_product.css">
</head>
<body>

    <!-- Contenedor principal -->
    <div class="main-content">
        <div class="content-wrapper">

            <!-- Imagen del producto -->
            <div class="image-section">
                <div class="image-container">
                    <img src="/frontend/public/img/Imagen de WhatsApp 2025-11-10 a las 14.47.11_ae0405ec.jpg" alt="Guanabana" class="product-image">
                    <p class="image-text">Seleccione una imagen.</p>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="editarFoto()">Editar Foto</button>
                    <button class="btn btn-primary" onclick="editarPerfil()">Editar Perfil</button>
                </div>
            </div>

            <!-- Formulario de producto -->
            <div class="form-section">
                <form id="productForm">
                    <div class="form-grid">
                        
                        <div class="form-group">
                            <label class="form-label">Nombre Producto</label>
                            <input type="text" class="form-input" value="Guanabana" id="nombreProducto">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Tipo de producto</label>
                            <select class="form-select" id="tipoProducto">
                                <option value="fruta" selected>Fruta</option>
                                <option value="verdura">Verdura</option>
                                <option value="carnes">Carne</option>
                                <option value="fertilizantes">Fertilizante</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Peso producto</label>
                            <input type="number" class="form-input" value="2" id="pesoProducto">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Tipo de peso</label>
                            <select class="form-select" id="tipoPeso">
                                <option value="kilos" selected>Kilos</option>
                                <option value="gramos">Gramos</option>
                                <option value="libras">Libras</option>
                                <option value="toneladas">Toneladas</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Precio producto</label>
                            <input type="text" class="form-input" value="10.000$" id="precioProducto">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Descuento</label>
                            <select class="form-select" id="descuento">
                                <option value="no" selected>No aplica.</option>
                                <option value="10">10%</option>
                                <option value="15">15%</option>
                                <option value="20">20%</option>
                            </select>
                        </div>

                        <div class="submit-container">
                            <button type="submit" class="btn-submit">Siguiente</button>
                        </div>

                    </div>
                </form>
            </div>

        </div>
    </div>

</body>
</html>

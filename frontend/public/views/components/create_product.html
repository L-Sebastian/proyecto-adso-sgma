<div class="content-wrapper-create">

    <!-- Imagen del producto -->
    <div class="image-section-create">
        <div class="image-container-create">
            <input type="file" id="photoInput" accept="image/*" style="display:none;">

            <!-- Área clickeable para cambiar la foto -->
            <div class="product-avatar-create" id="avatarContainer">
                <img id="avatarImgProduct" src="" alt="Foto de producto"
                     >
                <svg id="avatarSvgProduct" class="avatar-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>

            <div class="button-group-create">
                <button class="btn-create btn-primary-create" id="uploadBtn" type="button">Editar Foto</button>
            </div>
        </div>
    </div>

    <!-- Formulario de producto -->
    <div class="form-section-create">
        <div class="form-grid-create">

            <div class="form-group-create">
                <label class="form-label-create">Nombre Producto</label>
                <input type="text" class="form-input-create" value="Guanabana" id="nombreProducto">
            </div>

            <div class="form-group-create">
                <label class="form-label-create">Tipo de producto</label>
                <select class="form-select-create" id="tipoProducto">
                    <option value="fruta" selected>Fruta</option>
                    <option value="verdura">Verdura</option>
                    <option value="carnes">Carne</option>
                    <option value="fertilizantes">Fertilizante</option>
                </select>
            </div>

            <div class="form-group-create">
                <label class="form-label-create">Peso producto</label>
                <input type="number" class="form-input-create" value="2" id="pesoProducto">
            </div>

            <div class="form-group-create">
                <label class="form-label-create">Tipo de peso</label>
                <select class="form-select-create" id="tipoPeso">
                    <option value="kilos" selected>Kilos</option>
                    <option value="gramos">Gramos</option>
                    <option value="libras">Libras</option>
                    <option value="toneladas">Toneladas</option>
                </select>
            </div>

            <div class="form-group-create">
                <label class="form-label-create">Precio producto</label>
                <input type="text" class="form-input-create" value="10.000$" id="precioProducto">
            </div>

            <div class="form-group-create">
                <label class="form-label-create">Descuento</label>
                <select class="form-select-create" id="descuento">
                    <option value="no" selected>No aplica.</option>
                    <option value="10">10%</option>
                    <option value="15">15%</option>
                    <option value="20">20%</option>
                </select>
            </div>

            <div class="submit-container-create">
                <button type="button" class="btn-submit-create" id="btnSiguiente">Siguiente</button>
            </div>

        </div>
    </div>

</div>

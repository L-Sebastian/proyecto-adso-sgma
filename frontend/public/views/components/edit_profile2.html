<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil SGMA</title>
    <link rel="stylesheet" href="/frontend/public/css/components/edit_profile2.css">
    <link rel="stylesheet" href="/frontend/public/css/variables.css">
</head>
<body>

    <div class="container-main">

        <main class="main-content">
            <div class="background-overlay"></div>

            <div class="profile-container">
                <div class="profile-grid">

                    <!-- LEFT SECTION -->
                    <div class="profile-left">
                        <div class="avatar">
                            <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>

                        <h2 class="profile-name">Juan Antonio<br>de la Cruz</h2>

                        <button class="btn btn-back">Volver</button>
                    </div>

                    <!-- RIGHT SECTION -->
                    <div class="profile-right">

                        <div class="form-row">
                            <div class="form-group">
                                <label>1mer Nombre</label>
                                <input type="text" class="form-input" value="Juan">
                            </div>

                            <div class="form-group">
                                <label>2do Nombre</label>
                                <input type="text" class="form-input" value="Antonio">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>1mer Apellido</label>
                                <input type="text" class="form-input" value="de la Cruz">
                            </div>

                            <div class="form-group">
                                <label>2do Apellido</label>
                                <input type="text" class="form-input">
                            </div>
                        </div>

                        <div class="form-row full-width">
                            <div class="form-group">
                                <label>Correo electrónico</label>
                                <input type="email" class="form-input" value="juandelosantoscruz11@gmail.com">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Departamento</label>
                                <input type="text" class="form-input" value="Risaralda">
                            </div>

                            <div class="form-group">
                                <label>Dirección</label>
                                <input type="text" class="form-input" value="Calle 18 #3-60, Pereira">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-save">Guardar</button>
                        </div>

                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>



    <div class="container-main-profile">

        <main class="main-content-profile">
            <div class="background-overlay-profile"></div>

            <div class="profile-container-profile">
                <div class="profile-grid-profile">

                    <!-- LEFT SECTION -->
                    <div class="profile-left-profile">
                        <div class="avatar-profile">
                            <svg class="avatar-icon-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>

                        <h2 class="profile-name-profile">Juan Antonio<br>de la Cruz</h2>

                        <button class="btn btn-back-profile">Volver</button>
                    </div>

                    <!-- RIGHT SECTION -->

                        <div class="profile-right-profile">
                            <!-- Names Row -->
                            <div class="form-row-profile">
                                <div class="form-group-profile">
                                    <label for="firstName">1mer Nombre</label>
                                    <input type="text" id="firstName" name="firstName" value="Juan" class="form-input-profile">
                                </div>
                                <div class="form-group-profile">
                                    <label for="secondName">2do Nombre</label>
                                    <input type="text" id="secondName" name="secondName" placeholder="Antonio" class="form-input-profile">
                                </div>
                            </div>

                            <!-- Last Names Row -->
                            <div class="form-row-profile">
                                <div class="form-group-profile">
                                    <label for="firstLastName">1mer Apellido</label>
                                    <input type="text" id="firstLastName" name="firstLastName" value="de la Cruz" class="form-input">
                                </div>
                                <div class="form-group-profile">
                                    <label for="secondLastName">2do Apellido</label>
                                    <input type="text" id="secondLastName" name="secondLastName" class="form-input">
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="form-row full-width-profile">
                                <div class="form-group-profile">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" id="email" name="email" value="juandelosantoscruz11@gmail.com" class="form-input-profile">
                                </div>
                            </div>

                            <!-- Department and Address -->
                            <div class="form-row-profile">
                                <div class="form-group-profile">
                                    <label for="departamento">Departamento</label>
                                    <select id="departamento" name="departamento" class="profile__form-select" required autocomplete="address-level1">
                                        <option value="">-Selecciona tu departamento-</option>
                                        <option value="Risaralda">Risaralda</option>
                                        <option value="Quindío">Quindío</option>
                                        <option value="Caldas">Caldas</option>
                                    </select>
                                </div>
                                <div class="form-group-profile">
                                    <label for="address">Dirección</label>
                                    <input type="text" id="address" name="address" value="Calle 18 #3-60, Pereira" class="form-input-profile">
                                </div>
                            </div>
                    </div>

                    <div class="form-actions-profile">
                        <button class="btn btn-save-profile">Guardar</button>
                    </div>

                    
                </div>
            </div>

        </main>
    </div>

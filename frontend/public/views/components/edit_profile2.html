<div class="container-main-profile">

    <main class="main-content-profile-2">
        <div class="background-overlay-profile"></div>

        <div class="profile-container-profile">
            <div class="profile-grid-profile">

                <!-- LEFT SECTION -->
                <div class="profile-left-profile">
                    <div class="avatar-profile">
                        <img id="avatarImgProfile" src="" alt="Foto de perfil"
                             style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:none;">
                        <svg id="avatarSvgProfile" class="avatar-icon-profile" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>

                    <h2 class="profile-name-profile" id="profileNameProfile">Juan Antonio<br>de la Cruz</h2>

                    <button class="btn-profile2 btn-back-profile" type="button" id="btnVolver">Volver</button>
                </div>

                <!-- RIGHT SECTION — campos EDITABLES -->
                <div class="profile-right-profile">

                    <div class="form-row-profile">
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="firstName">1er Nombre</label>
                            <input type="text" id="firstName" name="firstName"
                                   value="Juan" class="form-input-profile">
                        </div>
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="secondName">2do Nombre</label>
                            <input type="text" id="secondName" name="secondName"
                                   value="Antonio" class="form-input-profile">
                        </div>
                    </div>

                    <div class="form-row-profile">
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="firstLastName">1er Apellido</label>
                            <input type="text" id="firstLastName" name="firstLastName"
                                   value="de la Cruz" class="form-input-profile">
                        </div>
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="secondLastName">2do Apellido</label>
                            <input type="text" id="secondLastName" name="secondLastName"
                                   value="" class="form-input-profile">
                        </div>
                    </div>

                    <div class="form-row-profile full-width-profile">
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email"
                                   value="juandelosantoscruz11@gmail.com" class="form-input-profile-email">
                        </div>
                    </div>

                    <div class="form-row-profile">
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="departamento">Departamento</label>
                            <select id="departamento" name="departamento"
                                    class="profile__form-select"
                                    autocomplete="address-level1">
                                <option value="">— Selecciona tu departamento —</option>
                                <option value="Risaralda" selected>Risaralda</option>
                                <option value="Quindío">Quindío</option>
                                <option value="Caldas">Caldas</option>
                            </select>
                        </div>
                        <div class="form-group-profile">
                            <label class="label-edit-profile-user" for="address">Dirección</label>
                            <input type="text" id="address" name="address"
                                   value="Calle 18 #3-60, Pereira" class="form-input-profile">
                        </div>
                    </div>
                    <div class="form-actions-profile">
                        <button class="btn-profile2 btn-save-profile" type="button" id="btnGuardar">Guardar</button>
                    </div>

                </div><!-- /profile-right-profile -->

                    

            </div><!-- /profile-grid-profile -->
        </div><!-- /profile-container-profile -->

    </main>

</div><!-- /container-main-profile -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMA - Perfil de Usuario</title>
    <link rel="stylesheet" href="/frontend/public/css/components/profile.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">SGMA 🌿</div>
            <div class="social-icons">
                <a href="#" class="social-icon" aria-label="Facebook">f</a>
                <a href="#" class="social-icon" aria-label="YouTube">▶</a>
                <a href="#" class="social-icon" aria-label="TikTok">📱</a>
                <a href="#" class="social-icon" aria-label="Instagram">📷</a>
            </div>
        </div>
    </header>

    <!-- Sub Header -->
    <div class="sub-header">
        <div class="sub-header-content">
            <div class="user-info">
                <span class="icon-user">👤</span>
                <span>Perfil</span>
            </div>
            <div class="user-name-header">Juan Antonio de la Cruz</div>
            <button class="btn-logout">⏻</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="profile-container">
            <!-- Left Side - Profile Card -->
            <aside class="profile-card">
                <div class="avatar-section">
                    <div class="avatar">
                        <svg viewBox="0 0 100 100" class="avatar-icon">
                            <circle cx="50" cy="35" r="15" fill="none" stroke="#00d084" stroke-width="2"/>
                            <path d="M 30 65 Q 50 55 70 65" fill="none" stroke="#00d084" stroke-width="2"/>
                        </svg>
                    </div>
                </div>
                <h2 class="profile-name">Juan Antonio<br>de la Cruz</h2>
                <div class="profile-actions">
                    <button class="btn-profile btn-upload">Subir Foto</button>
                    <button class="btn-profile btn-edit">Editar Perfil</button>
                </div>
            </aside>

            <!-- Right Side - Profile Form -->
            <section class="profile-form-section">
                <form class="profile-form" id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">1mer Nombre</label>
                            <input type="text" id="firstName" name="firstName" value="Juan" readonly>
                        </div>
                        <div class="form-group">
                            <label for="secondName">2do Nombre</label>
                            <input type="text" id="secondName" name="secondName" value="Antonio" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstLastName">1mer Apellido</label>
                            <input type="text" id="firstLastName" name="firstLastName" value="de la Cruz" readonly>
                        </div>
                        <div class="form-group">
                            <label for="secondLastName">2do Apellido</label>
                            <input type="text" id="secondLastName" name="secondLastName" value="" readonly>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" value="juandelasantoscruz11@gmail.com" readonly>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="department">Departamento</label>
                            <select id="department" name="department" disabled>
                                <option value="Risaralda">Risaralda</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="address">Dirección</label>
                            <input type="text" id="address" name="address" value="Calle 18 #3-60, Pereira" readonly>
                        </div>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>©SGMA - TODOS LOS DERECHOS RESERVADOS</p>
    </footer>

    <script src="perfil-script.js"></script>
</body>
</html>

<section class="pay-content-pay">
    <div class="checkout-container-pay">

        <!-- COLUMNA IZQUIERDA -->
        <div class="checkout-left-pay">

            <!-- MÉTODOS DE PAGO -->
            <div class="payment-methods-pay">
                <h3>Métodos de pago</h3>
                <div class="payment-logos-pay">
                    <img src="/frontend/public/img/visa.svg" alt="Visa">
                    <img src="/frontend/public/img/mastercard.svg" alt="Mastercard">
                    <img src="/frontend/public/img/american-express.svg" alt="American Express">
                    <img src="/frontend/public/img/diners.svg" alt="Diners">
                    <img src="/frontend/public/img/pse-seeklogo.svg" alt="PSE">
                    <img src="/frontend/public/img/via_baloto.svg" alt="Via Baloto">
                    <img src="/frontend/public/img/baloto.svg" alt="Baloto">
                    <img src="/frontend/public/img/efecty.svg" alt="Efecty">
                </div>
            </div>

            <!-- FORMULARIO -->
            <div class="form-section-pay">

                <!-- PASO 1 -->
                <div class="form-step-pay">
                    <div class="step-header-pay">
                        <div class="step-number-pay">1</div>
                        <div class="step-title-pay">Tus datos</div>
                        <a href="#" class="modify-link-pay">Modificar Mis Datos</a>
                    </div>
                    <div class="user-info-pay"></div>
                </div>

                <!-- PASO 2 -->
                <div class="form-step-pay">
                    <div class="step-header-pay">
                        <div class="step-number-pay">2</div>
                        <div class="step-title-pay">Selecciona el medio de pago</div>
                        <a href="#" class="modify-link-pay">Cambiar medio de pago</a>
                    </div>

                    <div class="payment-options-pay">
                        <div class="payment-option-pay" data-method="visa"><img src="/frontend/public/img/visa.svg" alt="Visa"></div>
                        <div class="payment-option-pay" data-method="diners"><img src="/frontend/public/img/diners-club.svg" alt="Diners Club"></div>
                        <div class="payment-option-pay selected" data-method="mastercard"><img src="/frontend/public/img/mastercard.svg" alt="Mastercard"></div>
                        <div class="payment-option-pay" data-method="amex"><img src="/frontend/public/img/american-express.svg" alt="American Express"></div>
                        <div class="payment-option-pay" data-method="pse"><img src="/frontend/public/img/pse-seeklogo.svg" alt="PSE"></div>
                    </div>

                    <div class="form-grid-pay">

                        <div class="form-group-pay full-width-pay">
                            <label class="form-label-pay">Nombre en la tarjeta *</label>
                            <input type="text" class="form-input-pay cardName">
                        </div>

                        <div class="form-group-pay">
                            <label class="form-label-pay">Documento de Identidad *</label>
                            <div class="form-row-pay">
                                <select class="form-select-pay docType">
                                    <option>C.C</option>
                                    <option>T.I</option>
                                    <option>C.E</option>
                                </select>
                                <input type="text" class="form-input-pay docNumber">
                            </div>
                        </div>

                        <div class="form-group-pay">
                            <label class="form-label-pay">Número de Tarjeta *</label>
                            <input type="text" class="form-input-pay cardNumber" maxlength="19">
                        </div>

                        <div class="form-group-pay">
                            <label class="form-label-pay">Código de Seguridad *</label>
                            <input type="password" class="form-input-pay cardCvv" maxlength="3" placeholder="***">
                        </div>

                        <div class="form-group-pay">
                            <label class="form-label-pay">Fecha de Vencimiento *</label>
                            <div class="form-row-pay">
                                <select class="form-select-pay expMonth">
                                    <option>01</option><option>02</option><option>03</option>
                                    <option>04</option><option>05</option><option>06</option>
                                    <option>07</option><option>08</option><option>09</option>
                                    <option>10</option><option>11</option><option selected>12</option>
                                </select>
                                <span class="date-separator-pay">/</span>
                                <select class="form-select-pay expYear">
                                    <option selected>24</option><option>25</option><option>26</option>
                                    <option>27</option><option>28</option><option>29</option>
                                    <option>30</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group-pay full-width-pay">
                            <label class="form-label-pay">Número de teléfono *</label>
                            <input type="tel" class="form-input-pay phoneNumber">
                        </div>

                    </div>
                </div>
            </div>

            <div class="pay-form-help payFormHelp" aria-live="polite"></div>
            <button class="pay-button-pay btnPagar">Pagar</button>
        </div>

        <!-- COLUMNA DERECHA -->
        <div class="summary-section-pay">
            <div class="summary-card-pay">
                <div class="summary-header-pay">Resumen de la compra</div>

                <div class="summary-item-pay">
                    <label>Referencia:</label>
                    <div>0000</div>
                </div>

                <div class="summary-item-pay">
                    <label>Descripción:</label>
                    <div>—</div>
                </div>

                <div class="summary-item-pay summary-total-pay">
                    <label>Total a pagar ................</label>
                    <div>—</div>
                    <div class="summary-note-pay">COP: Pesos colombianos</div>
                </div>

                <!-- TARJETA -->
                <div class="credit-card-pay">
                    <div class="card-logo-pay">
                        <svg width="60" height="40" viewBox="0 0 60 40" aria-label="Mastercard">
                            <circle cx="20" cy="20" r="18" fill="#EB001B" opacity="0.8"/>
                            <circle cx="40" cy="20" r="18" fill="#FF5F00" opacity="0.8"/>
                        </svg>
                    </div>
                    <div class="card-chip-pay"></div>
                    <div class="card-number-pay displayCardNumber">•••• •••• •••• ••••</div>
                    <div class="card-info-pay">
                        <div class="card-holder-pay">
                            <div class="label-small-pay">TITULAR</div>
                            <div class="displayCardName">—</div>
                        </div>
                        <div>
                            <div class="label-small-pay">VÁLIDA</div>
                            <div class="displayExpiry">••/••</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

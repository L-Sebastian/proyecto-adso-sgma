<!-- Main Content -->
<main class="main-content-recover">

    <!-- Left Section - imagen -->
    <section class="testimonial-section-recover" aria-hidden="true"></section>

    <!-- Right Section - Recovery Form -->
    <section class="recovery-section-recover" aria-labelledby="recoveryTitle">
        <h1 id="recoveryTitle" class="recovery-title-recover">Recuperación de Cuenta</h1>

        <!-- BUG CORREGIDO: se agregó id="recoveryForm" para que el JS pueda seleccionarlo -->
        <form class="recovery-form-recover" id="recoveryForm" novalidate>

            <div class="form-group-recover">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@correo.com"
                    required
                    autocomplete="email"
                    aria-required="true"
                />
            </div>

            <div class="form-group-recover">
                <label for="telefono">Número de teléfono</label>
                <!-- BUG CORREGIDO: se eliminó clase 'register__form-input' de otro componente -->
                <input
                    id="telefono"
                    name="telefono"
                    type="tel"
                    pattern="[0-9]{7,10}"
                    placeholder="3001234567"
                    title="Debe contener entre 7 y 10 números"
                    required
                    autocomplete="tel"
                    aria-required="true"
                />
            </div>

            <!-- Mensaje de error/éxito -->
            <div id="formHelpRecover" class="form-help-recover" aria-live="polite"></div>

            <button type="submit" class="submit-btn-recover">Enviar código</button>

        </form>
    </section>

</main>

<!-- Main Content -->
<main class="main-content">
    <!-- Left Section - Testimonial -->
    <section class="testimonial-section">

    </section>

    <!-- Right Section - Recovery Form -->
    <section class="recovery-section">
        <h1 class="recovery-title">Recuperación de Cuenta</h1>
        
        <form class="recovery-form" id="recoveryForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefono">Número de teléfono</label>
                <input 
                    id="telefono" 
                    class="register__form-input" 
                    type="tel" 
                    pattern="[0-9]{7,10}" 
                    placeholder="3001234567"
                    title="Debe contener entre 7 y 10 números" 
                    required
                />
            </div>

            <!-- ⚠️ REMOVIDO el onclick, ahora lo maneja JavaScript -->
            <button type="submit" class="submit-btn">Enviar código</button>
        </form>
    </section>
</main>

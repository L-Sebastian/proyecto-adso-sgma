<!-- Main Content -->
<main class="main-content">
    <!-- Left Section - Testimonial -->
    <section class="hero-section">
    </section>

    <!-- Right Section - Login Form -->
    <section class="login-section">
        <h1 class="login-title">Inicia Sesión</h1>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <!-- ⚠️ REMOVIDOS los onclick, ahora lo maneja JavaScript -->
            <button type="submit" class="submit-btn">Iniciar Sesión</button>
        
            <div class="action-buttons">
                <button type="button" class="secondary-btn" id="createAccountBtn">Crear Cuenta</button>
                <button type="button" class="secondary-btn" id="recoverAccountBtn">Recuperar Cuenta</button>
            </div>
        </form>
    </section>
</main>

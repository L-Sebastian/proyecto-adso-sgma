<!-- Main Content -->
<main class="main-content-login">
    <!-- Left Section - Testimonial -->
    <section class="hero-section-login">
    </section>

    <!-- Right Section - Login Form -->
    <section class="login-section-login">
        <h1 class="login-title-login">Inicia Sesión</h1>
        
        <form class="login-form-login" id="loginForm">
            <div class="form-group-login">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <div class="form-group-login">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <!-- ⚠️ REMOVIDOS los onclick, ahora lo maneja JavaScript -->
            <button type="submit" class="submit-btn-login">Iniciar Sesión</button>
        
            <div class="action-buttons-login">
                <button type="button" class="secondary-btn-login" id="createAccountBtn">Crear Cuenta</button>
                <button type="button" class="secondary-btn-login" id="recoverAccountBtn">Recuperar Cuenta</button>
            </div>
        </form>
    </section>
</main>

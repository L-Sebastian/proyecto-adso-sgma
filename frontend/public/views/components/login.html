<!-- Main Content -->
<main class="main-content-login" aria-labelledby="loginTitle">
  <!-- Left Section - Testimonial -->
  <section class="hero-section-login" aria-hidden="false">
    <div class="hero-content-login">
      <div class="producer-name-login"></div>
      <div class="producer-title-login"></div>
      <div class="testimonial-login"></div>
    </div>
  </section>

  <!-- Right Section - Login Form -->
  <section class="login-section-login">
    <h1 id="loginTitle" class="login-title-login">Inicia Sesión</h1>

    <form class="login-form-login" id="loginForm" role="form" novalidate>
      <div class="form-group-login">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="ejemplo@correo.com"
          required
          autocomplete="email"
          aria-required="true"
          aria-describedby="emailHelp"
        />
      </div>

      <div class="form-group-login">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
          aria-required="true"
        />
      </div>

      <button type="submit" class="submit-btn-login" aria-label="Iniciar sesión">Iniciar Sesión</button>

      <div class="action-buttons-login" role="group" aria-label="Acciones de cuenta">
        <button type="button" class="secondary-btn-login" id="createAccountBtn">Crear Cuenta</button>
        <button type="button" class="secondary-btn-login" id="recoverAccountBtn">Recuperar Cuenta</button>
      </div>
    </form>
  </section>
</main>

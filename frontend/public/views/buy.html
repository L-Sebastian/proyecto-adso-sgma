<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/frontend/public/css/main.css">

    <title>Comprar</title>

    <script src="/frontend/public/js/components/header-index.js" defer></script>
    <script src="/frontend/public/js/components/navbar-buy.js" defer></script>
    <script src="/frontend/public/js/components/discount-product-buy.js" defer></script>
    <script src="/frontend/public/js/components/filters-product-buy.js" defer></script>
    <script src="/frontend/public/js/components/footer.js" defer></script>

    <script>
    function buscar(event) {
        event.preventDefault(); // evita que recargue la página
        const texto = document.getElementById("searchInput").value;

        if (texto.trim() === "") {
            alert("Escribe algo para buscar");
            return;
        }

        // Ejemplo de redirección
        window.location.href = "buscar.html?q=" + encodeURIComponent(texto);
    }
    
    document.addEventListener("DOMContentLoaded", function() {
        const btnComprar = document.getElementById("btn-comprar");
        const loginAlert = document.getElementById("login-alert");

        btnComprar.addEventListener("click", function(event) {
            event.preventDefault(); // Evita que el enlace navegue
            loginAlert.style.display = "block"; // Muestra el mensaje
        });
    });

    </script>
    <style>
        #login-alert {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        padding: 1rem;
        border-radius: 5px;
        display: inline-block;
}

    #login-alert .btn-login {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        background-color: #28a745;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
    }

    </style>
</head>
</html>
<body>
    <!-- Header -->
    <header class="header__index">
    </header>

    <!-- Navbar -->
    <nav class="navbar__buy">
        <div class="navbar__container"></div>
    </nav>

    <!-- Discount product -->
    <section class="discounts">
        <div class="product__button">

        </div>
    </section>

    <!-- Botones filtros -->
    <section class="filters">
        <div class="productsContainer">
            
        </div>
    </section>

    <a href="#" id="btn-comprar" class="product__button">COMPRAR</a>

<!-- Contenedor donde aparecerá el aviso -->
<div id="login-alert" style="display: none; margin-top: 1rem;">
    <p>No has iniciado sesión</p>
    <a href="/frontend/public/views/login.html" class="btn-login">Iniciar sesión</a>
</div>

    
    <!-- Footer -->
    <footer class="footer__index">
        <div class="footer-container">

        </div>
    </footer>

    

</body>
</html>

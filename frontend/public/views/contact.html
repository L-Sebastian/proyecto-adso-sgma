<section class="contact">
  <h2 class="contact__title">Contáctanos</h2>
  <p class="contact__subtitle">Déjanos tus datos, nosotros te contactaremos</p>

  <div class="contact__container">
    <form class="contact__form">
      <input class="contact__input" type="text" placeholder="Nombre" required>
      <div class="contact__form-row">
        <input class="contact__input" type="email" placeholder="Correo electrónico" required>
        <input class="contact__input" type="tel" placeholder="Teléfono">
      </div>
      <textarea class="contact__textarea" placeholder="Mensaje" rows="5" required></textarea>
      <button type="submit" class="contact__btn">Enviar</button>
    </form>
    <div class="contact__map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18..."
              width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy">
      </iframe>
    </div>
  </div>
</section>
<link rel="stylesheet" href="/frontend/public/css/components/contact.css">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/public/css/variables.css">
    <link rel="stylesheet" href="/frontend/public/css/layout.css">

    <style>
        /* Para quitarle el espacio en blanco */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--primary-secundary-700);
        }
        header{
            background:  var(--primary-600);
            /*alterar el padding aqui, tambien altera en el index*/
            /* padding 25 en el componente */
            /*padding: 15px;*/
            color: white;
            
        }

        .header__login__content {
            display: flex;
            align-items: center;
            justify-content:space-between;


            margin-left: 3rem;
            gap: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Comprobar medidas */
            
            
        }
    
        .header__logo {
            padding-right: 5rem;
            gap: 24px;

            
        }

        .text {
            padding-right: 5rem;
            font-size: 16px;
        }

        img {
            /* Alineamiento de los iconos */
            margin-top: 0.3rem;
            
        }
        @media (max-width: 768px) {
            header, .header__login__content{
                flex-direction: column;
                text-align: center;
                justify-content: center;
                gap: 0.8rem;
            }

            .text{
                text-align: center;
                padding-left: 3.7rem;
            }

            .text__2{
                text-align: center;
            }

            .header__logo{
                padding-left: 4rem;
            } 
        }

        /* */

        .form__login{
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: max-content;
            padding: 12px;
            margin: 0 auto; 
            justify-content: center;

            
        }

        .form__login__title{
            text-align: center;
            font-size: 34px;
        }

        .form__login__form{
            display: flex;
            flex-direction: column;
            gap: 24px;
            
        }

        .form__login__form-grup{
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            
        }

        .form__login__form-grup-label {
            margin: 0 0 0 20px;
            font-size: 12px;
        }

        .form__login__form-grup-input{
            height: 56px;
            font-size: 16px;
            width: 400px;
            padding: 16px;
            border-radius: 2.5rem;
            border:  none;

        }

        .form__login__form-button{
            background-color: var(--primary-600);
            width: 150px;
            text-decoration: none;
            font-size: 16px;
            color: white;
            padding: 0 16px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            border: none;
            margin: 0 auto;
        }
        .form__login__form-button a{
            text-decoration: none;
            color: white;
    

        }

        .form__login__form-row-button{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            
        }

        @media (width > 768px) {
            .login__content{
                
            }
        }

        .login__content{
            display: flex;
            height: 100vh; /* pantalla completa */
        }
        .login__content__right {
            flex: 70%;
            
            background: linear-gradient(to right, rgba(30,74,97,0) 70%, var(--primary-secundary-900) 100%),
                        url(/frontend/public/assets/img/DOÑA\ GLORIA.png);
            min-height: 50rem;
            background-size: cover;
        }

        .login__content__left{
            flex: 40%;
            margin: auto;
        }

    </style>
</head>

    </header>

    <div class="login__content">
        <div class="login__content__right">

        </div>
        
        <div class="login__content__left">
            <div class="form__login">
                <h1 class="form__login__title">Inicia Sesión</h1>
            <form>
                <div class="form__login__form">
                    <div class="form__login__form-grup">
                        <label class="form__login__form-grup-label">
                            Correo Electronico
                        </label>
                        <input type="email" placeholder="Ingresa tu Correo" class="form__login__form-grup-input">
                    </div>

                    <div class="form__login__form-grup">
                        <label class="form__login__form-grup-label">
                            Contraseña
                        </label>
                        <input type="text" placeholder="Ingresa tu Contraseña" class="form__login__form-grup-input">
                    </div>
                    
                    <button class="form__login__form-button">
                        <a href="#">Iniciar Sesión</a>
                    </button> 
                    
                    <div class="form__login__form-row-button">
                        <a href="#" class="form__login__form-button">Crear Cuenta</a>
                        <a href="#" class="form__login__form-button">Recuperar Cuenta</a>
                        
                    </div>

                </div>
            </form>
            </div>

        </div>
    </div>

</html>
